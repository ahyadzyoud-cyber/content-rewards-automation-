name: Verify Whop callback HTTPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Only standard runners on this public project; no billing, artifacts or secrets.
    if: github.event.repository.private == false && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify TLS, private storage health and callback redirect
        env:
          REWARDS_LIVE_PUBLISHING: 'false'
        run: |
          python - <<'PY'
          import json
          import re
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener, urlopen

          origin = 'https://content-rewards-whop.content-rewards-dc8a4aba9226.workers.dev'
          headers = {'User-Agent': 'ContentRewardsAutomation/0.1', 'Accept': 'application/json'}
          try:
              with urlopen(Request(origin + '/health', headers=headers), timeout=30) as response:
                  assert response.status == 200
                  health = json.load(response)
              assert health['status'] == 'ok'
              assert health['live_publishing'] is False
              assert health['requested_scope'] == 'bounty:basic:read'
              assert health['production_verified'] is False
          except Exception as error:
              diagnostic = {'stage': 'health', 'error_type': type(error).__name__}
              if isinstance(error, HTTPError):
                  diagnostic['http_status'] = error.code
                  diagnostic['server'] = error.headers.get('Server', '')[:100]
                  diagnostic['content_type'] = error.headers.get('Content-Type', '')[:100]
                  diagnostic['edge_challenge'] = error.headers.get('cf-mitigated', '')[:100]
                  # This deployment's errors are sanitized; never emit unknown HTML.
                  raw = error.read(8192).decode('utf-8', errors='replace')
                  try:
                      body = json.loads(raw)
                      if isinstance(body, dict) and isinstance(body.get('error'), str):
                          diagnostic['worker_error'] = body['error'][:200]
                  except Exception:
                      title = re.search(r'<title[^>]*>([^<]{0,120})', raw, re.IGNORECASE)
                      diagnostic['public_error_page_title'] = title.group(1) if title else ''
                      diagnostic['provider_error_numbers'] = re.findall(r'(?:error code:|Error)\s*(\d{3,5})', raw, re.IGNORECASE)
                      diagnostic['plain_forbidden'] = raw.strip().lower() == 'forbidden'
              print('::error title=Whop HTTPS diagnostic::' + json.dumps(diagnostic))
              raise SystemExit(1)

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          try:
              build_opener(NoRedirect).open(Request(origin + '/oauth/callback', headers=headers), timeout=30)
              raise AssertionError('A callback without owner state must redirect safely')
          except HTTPError as response:
              valid = (response.code == 303
                       and response.headers['Location'] == '/oauth/result'
                       and response.headers['Cache-Control'] == 'no-store'
                       and response.headers['Referrer-Policy'] == 'no-referrer')
              if not valid:
                  print('::error title=Whop callback diagnostic::' + json.dumps({
                      'stage': 'callback', 'http_status': response.code,
                      'relative_clean_redirect': response.headers['Location'] == '/oauth/result',
                      'cache_control_ok': response.headers['Cache-Control'] == 'no-store',
                      'referrer_policy_ok': response.headers['Referrer-Policy'] == 'no-referrer'}))
                  raise SystemExit(1)
          print(json.dumps({'https_verified': True, 'database_health': 'ok',
                            'invalid_callback_safely_redirected': True,
                            'owner_configuration_complete': health['owner_configuration_complete'],
                            'live_publishing': False, 'authorization_verified': False}))
          PY
