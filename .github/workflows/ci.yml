name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q
      - run: uv build
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Whop OAuth broker syntax and security contracts
        working-directory: cloud/whop
        run: |
          npm run check
          npm test
      - name: Install locked browser regression tools
        working-directory: cloud/whop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify owner forms in real Chromium
        working-directory: cloud/whop
        run: npm run test:browser
