name: Free public cloud observer

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      initialize_state:
        description: 'First run only: initialize the missing public checkpoint branch'
        type: boolean
        required: true
        default: false
      public_feed_url:
        description: 'Optional provider-approved public no-cost normalized JSON feed'
        type: string
        default: ''
      confirm_permitted_public_no_cost_feed:
        description: 'If adding a feed, its automated use and public redistribution are permitted and free'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rewards-free-public-observation-state
  cancel-in-progress: false

jobs:
  observe:
    # Standard GitHub-hosted runners are free for public repositories. This
    # condition is evaluated before allocating a runner if the repo goes private.
    if: github.event.repository.private == false && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REWARDS_LIVE_PUBLISHING: 'false'
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked observation dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --no-dev
      - name: Observe and commit only a public checkpoint
        env:
          REWARDS_INITIALIZE_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_state == true }}
          REWARDS_PUBLIC_FEED_URL: ${{ inputs.public_feed_url }}
          REWARDS_CONFIRM_PUBLIC_FEED: ${{ inputs.confirm_permitted_public_no_cost_feed }}
        run: |
          if [ "$REWARDS_INITIALIZE_STATE" = 'true' ]; then
            .venv/bin/python scripts/git_cloud_worker.py --initialize-state
          else
            .venv/bin/python scripts/git_cloud_worker.py
          fi
