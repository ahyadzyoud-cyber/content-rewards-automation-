services:
  worker:
    image: content-rewards-dev:onboarding
    build: .
    command: ["rewards", "worker"]
    restart: unless-stopped
    env_file: ${REWARDS_ENV_FILE:-.env}
    environment:
      REWARDS_DATABASE: /app/.data/rewards.sqlite
      REWARDS_MEDIA_ROOT: /app/.data/media
    volumes:
      - rewards-data:/app/.data
    init: true
  api:
    image: content-rewards-dev:onboarding
    build: .
    command: ["uvicorn", "content_rewards.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    env_file: ${REWARDS_ENV_FILE:-.env}
    environment:
      REWARDS_DATABASE: /app/.data/rewards.sqlite
      REWARDS_MEDIA_ROOT: /app/.data/media
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rewards-data:/app/.data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
    init: true
volumes:
  rewards-data:
